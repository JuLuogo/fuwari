name: Deploy to Cloudflare Workers

# 推送到 main 后：
#   1. 构建静态站点
#   2. 直接部署到 Worker `peroe-blog`（保证站点始终是最新的）
#   3. 把构建产物发布到 `dist` 分支，供 Cloudflare Workers Builds 拉取部署
# 需要仓库 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 需要推送产物分支

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # update-diff 依赖 git 历史，浅克隆会让文章更新记录为空
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate post history
        run: pnpm update-diff

      - name: Build
        run: pnpm astro build --force

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 必须用 wrangler 4：v3 不支持「纯静态资源」Worker（会报 Missing entry-point）
          wranglerVersion: "4"
          command: deploy

      - name: Publish build artifact branch (dist)
        env:
          ARTIFACT_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: node scripts/publish-artifact.mjs --sha "${{ github.sha }}" --branch dist
